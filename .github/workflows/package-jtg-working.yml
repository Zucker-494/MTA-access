name: Package current JTG working submission

on:
  push:
    branches:
      - main
    paths:
      - ".github/run-jtg-package"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build flat working source
        run: |
          python manuscript/build_submission.py             --figures-dir figures             --output jtg_submission
          cp results/verified_results.md jtg_submission/
          cp results/input_sha256.txt jtg_submission/

      - name: Upload current working source
        uses: actions/upload-artifact@v4
        with:
          name: jtg-current-working-source
          path: jtg_submission
          if-no-files-found: error
          retention-days: 30
