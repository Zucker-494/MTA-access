name: Reproduce JTG analysis

on:
  push:
    branches:
      - main
    paths:
      - ".github/run-jtg-reproduction"
  workflow_dispatch:
    inputs:
      data_mode:
        description: "Use frozen submission data or the latest official MTA releases"
        required: true
        default: "frozen"
        type: choice
        options:
          - frozen
          - latest

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt

      - name: Select requested data mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "DATA_MODE=${{ inputs.data_mode }}" >> "$GITHUB_ENV"
          else
            echo "DATA_MODE=frozen" >> "$GITHUB_ENV"
          fi

      - name: Select frozen submission snapshots
        if: env.DATA_MODE == 'frozen'
        run: |
          echo "MAIN=data/MTA_NYCT_Subway_Elevator_and_Escalator_Availability__Beginning_2015_20261116.csv" >> "$GITHUB_ENV"
          echo "PLATFORM=data/MTA_Subway_Accessible_Station_Platform_Availability__Beginning_2018_20261116.csv" >> "$GITHUB_ENV"
          echo "STATIONS=data/station_complex_coordinates.csv" >> "$GITHUB_ENV"

      - name: Download latest official MTA data
        if: env.DATA_MODE == 'latest'
        run: |
          mkdir -p data/latest
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://data.ny.gov/api/v3/views/rc78-7x78/export.csv?accessType=DOWNLOAD" \
            -o data/latest/elevator_availability.csv
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://data.ny.gov/api/v3/views/thh2-syn7/export.csv?accessType=DOWNLOAD" \
            -o data/latest/platform_availability.csv
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://data.ny.gov/resource/5f5g-n3cz.csv?$limit=500' \
            -o data/latest/station_complexes.csv
          echo "MAIN=data/latest/elevator_availability.csv" >> "$GITHUB_ENV"
          echo "PLATFORM=data/latest/platform_availability.csv" >> "$GITHUB_ENV"
          echo "STATIONS=data/latest/station_complexes.csv" >> "$GITHUB_ENV"

      - name: Download official NYC borough boundaries
        run: |
          mkdir -p data/reference
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://data.cityofnewyork.us/resource/gthc-hcne.geojson?$limit=5' \
            -o data/reference/nyc_borough_boundaries.geojson

      - name: Validate Python syntax
        run: |
          python -m py_compile src/audit.py
          python -m py_compile src/longitudinal_analysis.py
          python -m py_compile src/make_figures.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Reproduce numerical analysis
        run: |
          rm -rf action_output
          python src/longitudinal_analysis.py \
            --main "$MAIN" \
            --platform "$PLATFORM" \
            --output action_output/results

      - name: Reproduce 300 dpi figures
        run: |
          python src/make_figures.py \
            --results action_output/results \
            --main "$MAIN" \
            --platform "$PLATFORM" \
            --stations "$STATIONS" \
            --borough-boundaries data/reference/nyc_borough_boundaries.geojson \
            --output action_output/figures_300dpi

      - name: Verify figure outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = [
              "fig1_spatial.png",
              "fig2_metric_gap.png",
              "fig3_reclassification.png",
              "fig4_persistence.png",
              "fig5_validation.png",
              "figS1_management_availability.png",
              "figS2_borough_metric_gap.png",
          ]
          root = Path("action_output/figures_300dpi")
          for name in expected:
              path = root / name
              if not path.exists():
                  raise SystemExit(f"Missing figure: {name}")
              im = Image.open(path)
              dpi = im.info.get("dpi", (0, 0))
              if min(dpi) < 299:
                  raise SystemExit(f"{name}: insufficient DPI metadata {dpi}")
              print(name, im.size, dpi)
          PY

      - name: Record provenance
        run: |
          sha256sum "$MAIN" "$PLATFORM" "$STATIONS" \
            data/reference/nyc_borough_boundaries.geojson \
            > action_output/input_sha256.txt
          {
            echo "data_mode=$DATA_MODE"
            echo "run_commit=$GITHUB_SHA"
            echo "run_date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            python --version
          } > action_output/run_info.txt

      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: jtg-reproduction-${{ env.DATA_MODE }}
          path: action_output
          if-no-files-found: error
          retention-days: 30
