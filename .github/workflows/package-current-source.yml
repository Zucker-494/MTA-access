name: Package current JTG source

on:
  push:
    branches:
      - main
    paths:
      - ".github/run-package-current-source"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Stage current source
        run: |
          mkdir -p current_source
          cp manuscript/*.tex current_source/
          cp manuscript/*.bib current_source/
          cp manuscript/*.txt current_source/ 2>/dev/null || true
          cp manuscript/*.md current_source/ 2>/dev/null || true
          cp figures/*.png current_source/
      - uses: actions/upload-artifact@v4
        with:
          name: jtg-current-source-after-review
          path: current_source
          retention-days: 7
